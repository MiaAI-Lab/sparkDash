# Two services:
#   sparkdash    — the multi-Spark dashboard (run once on the dashboard host,
#                  e.g. Narthex). Polls every node agent; see deploy/docker-compose.yml
#                  for the standalone variant that uses a prebuilt image.
#   node-agent   — the per-node agent (run once PER SPARK; on the dashboard host
#                  it monitors that host). Exposes telemetry/catalog/actions on
#                  :30091. Installed on a Spark via deploy/install-node-agent.sh.
# Both use host networking: the node agent must see host GPU/disk/proc, and the
# dashboard must reach node agents on their LAN IPs.
services:
  sparkdash:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
      args:
        # Frontend metrics-history retention (hours). Rebuild after changing.
        VITE_HISTORY_HOURS: ${VITE_HISTORY_HOURS:-8}
    container_name: sparkDash
    # always: come back after host reboot even if the container was stopped
    # before shutdown (unlike unless-stopped, which stays down after a manual stop).
    restart: always
    # Auto-restart Node when ./server files change (no image rebuild)
    command: ["node", "--watch", "server/index.js"]
    # Host network so local LLM probes reach loopback-bound servers
    # (ds4-server / start.sh default --host 127.0.0.1). Bridge NAT cannot
    # reach the host's 127.0.0.1, and LAN-IP probes miss loopback binds.
    network_mode: host
    privileged: true
    # Share host PID namespace so nvidia-smi compute-apps sees GPU processes
    # (otherwise local VRAM falls back to minute-old config/gpu-memory.json).
    pid: host
    volumes:
      # Live server code — edits apply after --watch reloads the process
      - ./server:/app/server
      # Prompt catalog imported by DecodeBench / Showcase (not under ./server)
      - ./src/shared:/app/src/shared:ro
      # Mount host filesystem for local Spark metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      # Mount nvidia-smi + driver libs (fallback if nsenter host path fails)
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:/usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:ro
      # Config + encrypted secrets (passwords survive restarts)
      - ./config:/app/config
      # Remote Sparks with SSH *key* auth: OpenSSH inside the container uses
      # /root/.ssh (not the host user's ~/.ssh). Uncomment and point at a
      # default-named key (id_ed25519 / id_rsa). A custom name like
      # id_ed25519_shared must be mounted *as* id_ed25519, or set
      # SSH_IDENTITY_FILE to the path inside the container.
      # - ${HOME}/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
    environment:
      # Secure default: host-networked service listens only on loopback.
      # See docs/REMOTE-ACCESS.md; direct non-loopback binds fail closed.
      - BIND_HOST=${BIND_HOST:-127.0.0.1}
      - SPARKDASH_TOKEN=${SPARKDASH_TOKEN:-}
      - SPARKDASH_ALLOW_OPEN_REMOTE=${SPARKDASH_ALLOW_OPEN_REMOTE:-1}
      - PORT=5555
      - LLM_PORT=8888
      - NODE_ENV=production
      - HOST_PROC_PATH=/host/proc
      - HOST_SYS_PATH=/host/sys
      - HOST_ROOT_PATH=/host/root
      - SSH_CONTROL_PERSIST_SECONDS=${SSH_CONTROL_PERSIST_SECONDS:-60}
      - SSH_IDENTITY_FILE=${SSH_IDENTITY_FILE:-}
      # Node registry the fleet connection manager polls (server/fleet/registry.js)
      - NODES_JSON_PATH=/app/config/nodes.json

  # ── Per-node agent: one container per Spark. Mirrors deploy/docker-compose.yml
  # (image-based variant there; here it builds agent/ into a lean node:18-slim
  # image — no deps today, builder stage kept for forward-compat).
  node-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.node-agent
      platforms:
        - linux/arm64
    container_name: sparkdash-node-agent
    restart: always
    # Host network: agent reports this host's GPU/disk/net and must bind
    # :30091 directly (LAN clients reach <host-ip>:30091; bridge NAT would
    # hide the real LAN IP).
    network_mode: host
    volumes:
      # Per-node recipe catalog. The repo ships agent/config/recipes.example.json;
      # add agent/config/recipes.json to override (the agent falls back to the
      # example when the default is missing — agent/main.js resolveRecipesPath).
      - ./agent/config:/app/agent/config:ro
    environment:
      # Node-agent HTTP port + bind (agent/main.js: readNodeIdentity).
      - NODE_AGENT_PORT=30091
      - NODE_AGENT_BIND=0.0.0.0
      # Recipe catalog path inside the container.
      - RECIPES_PATH=/app/agent/config/recipes.json
      # Optional bearer token for the agent's local HTTP API.
      - NODE_AGENT_TOKEN=${NODE_AGENT_TOKEN:-}
      # Identity: defaults to hostname when unset.
      - NODE_ID=${NODE_ID:-}
      - NODE_NAME=${NODE_NAME:-}
