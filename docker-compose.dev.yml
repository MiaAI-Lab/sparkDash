services:
  sparkdash:
    build:
      context: .
      dockerfile: Dockerfile.dev
      platforms:
        - linux/arm64
    container_name: sparkDash-dev
    restart: unless-stopped
    # Host network: Vite :5173 + API :5555 bind on the host; local LLM
    # probes reach 127.0.0.1-bound servers (ds4-server / start.sh default).
    network_mode: host
    volumes:
      # Full source — server --watch + Vite HMR, no rebuild for code edits
      - .:/app
      - /app/node_modules
      # Host metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:/usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:ro
      # Full config dir (sparks.json, secrets, gpu-memory)
      - ./config:/app/config
      # Remote Sparks with SSH key auth — see docker-compose.yml. Uncomment:
      # - ${HOME}/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
    privileged: true
    # Share host PID namespace so nvidia-smi compute-apps sees GPU processes
    # (otherwise local VRAM falls back to minute-old config/gpu-memory.json).
    pid: host
    environment:
      - BIND_HOST=${BIND_HOST:-127.0.0.1}
      - SPARKDASH_ALLOW_OPEN_REMOTE=${SPARKDASH_ALLOW_OPEN_REMOTE:-1}
      - PORT=5555
      - LLM_PORT=8888
      # Spark Dev Engine integration ports (API + Web UI)
      - DEV_ENGINE_API_PORT=10000
      - DEV_ENGINE_WEBUI_PORT=10001
      # AI proxy lives on spark1; dev engine is co-located (see docker-compose.yml)
      - AI_PROXY_HOST=spark1.lan
      - NODE_ENV=development
      - HOST_PROC_PATH=/host/proc
      - HOST_SYS_PATH=/host/sys
      - HOST_ROOT_PATH=/host/root
      # Model Launcher allowlist base on the target Sparks (see docker-compose.yml)
      - MODEL_REPOS_BASE=/home/pavelkubicek/cluster/docker
      # Operator local timezone — scheduler windows must not drift with UTC.
      - TZ=Europe/Prague
      - SSH_CONTROL_PERSIST_SECONDS=${SSH_CONTROL_PERSIST_SECONDS:-60}
      - SSH_IDENTITY_FILE=${SSH_IDENTITY_FILE:-}
