[package]
name = "sparkdash-agent"
version = "0.1.0"
description = "Read-only metrics agent for DGX Sparks: /proc, /sys and NVML over token-gated HTTP for sparkDash"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
libc = "0.2"
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
